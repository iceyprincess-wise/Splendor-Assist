# build-release.yml — Splendor-Assist release CI (Updater Round, Piece 2).
#
# On every push to main: bump versionCode by 1, commit the bump back
# ([skip ci] so it does not re-trigger this workflow), tag v<versionCode>,
# build a signed :app:assembleRelease, and create a GitHub Release with
# the APK attached. The release tag is the version source the in-app
# updater checks.
#
# SDK levels — API 36 update: change the three env values below only;
# the rest of the workflow reads them. Current main is targetSdk 34 /
# AGP 8.2.2 / NDK 25.1.8937393; the API 36 edits are not on main yet.
name: Build release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "25.1.8937393"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.ANDROID_NDK_VERSION }}"
          accept-android-sdk-licenses: true

      - name: Set NDK root for the native link shim
        run: echo "SPLENDOR_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Bump versionCode
        id: bump
        run: |
          ./bump_version.sh
          NEW_VERSION=$(grep -o "versionCode = [0-9]*" app/build.gradle.kts | grep -o "[0-9]*")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump versionCode to ${{ steps.bump.outputs.version }} [skip ci]"
          git push
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
